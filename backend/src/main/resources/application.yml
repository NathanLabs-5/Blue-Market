spring:
  application:
    name: blue-market-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/blue_market?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:blue_market_user}
    password: ${DB_PASSWORD:blue_market_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${SERVER_PORT:8080}
